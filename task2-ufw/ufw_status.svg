<svg viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>UFW Status Screenshot — Task 2 AICTE Oasis Infobyte</title>
  <desc>Terminal output of ufw status verbose showing SSH allowed and HTTP denied</desc>

  <!-- Window -->
  <rect x="0" y="0" width="720" height="580" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="38" rx="10" fill="#1c2128"/>
  <rect x="0" y="28" width="720" height="10" fill="#1c2128"/>
